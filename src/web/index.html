<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>zshell control</title>
<style>
:root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
body { margin:0; background:#111318; color:#e7eaf0; }
header { display:flex; justify-content:space-between; align-items:center; padding:18px 22px; border-bottom:1px solid #2a2e38; position:sticky; top:0; background:#111318ee; backdrop-filter:blur(10px); }
h1 { font-size:18px; margin:0; }
.status { display:flex; gap:12px; align-items:center; }
.badge { padding:5px 9px; border:1px solid #3a4050; border-radius:999px; font-size:12px; }
.badge.agent { border-color:#4972ff; }
.badge.human { border-color:#f1a43c; }
button { background:#202532; color:#fff; border:1px solid #3a4050; padding:8px 11px; border-radius:8px; cursor:pointer; }
button.danger { border-color:#a74949; }
button:disabled { opacity:.35; cursor:not-allowed; }
main { display:grid; grid-template-columns:minmax(320px, 42%) 1fr; min-height:calc(100vh - 66px); }
.left { padding:18px; border-right:1px solid #2a2e38; overflow:auto; }
.right { padding:18px; overflow:auto; }
section { margin-bottom:22px; }
h2 { font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:#9ea6b7; }
.card { border:1px solid #2b303b; border-radius:10px; padding:12px; margin:8px 0; background:#151922; }
.row { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; }
.meta { color:#929bad; font-size:12px; margin-top:6px; word-break:break-all; }
.command { font-family:ui-monospace, SFMono-Regular, Consolas, monospace; white-space:pre-wrap; word-break:break-word; }
.event { display:grid; grid-template-columns:70px 110px 1fr; gap:10px; padding:9px 0; border-bottom:1px solid #242832; font-size:13px; }
.event .src { color:#9ea6b7; }
.empty { color:#7f8797; font-size:13px; }
.notice { padding:10px 12px; border:1px solid #5f4d2f; background:#201b13; border-radius:8px; margin-bottom:14px; }
@media (max-width: 850px) { main { grid-template-columns:1fr; } .left { border-right:0; border-bottom:1px solid #2a2e38; } }
</style>
</head>
<body>
<header>
  <div><h1>zshell human control</h1><div id="service" class="meta">loading service status…</div></div>
  <div class="status">
    <span id="owner" class="badge">loading</span>
    <button id="take" onclick="takeControl()">Take Control</button>
    <button id="release" onclick="releaseControl()">Return Control</button>
  </div>
</header>
<main>
  <div class="left">
    <div id="notice"></div>
    <section><h2>Active executions</h2><div id="executions"></div></section>
    <section><h2>Jobs</h2><div id="jobs"></div></section>
    <section><h2>Shells</h2><div id="shells"></div></section>
  </div>
  <div class="right">
    <section><h2>Activity</h2><div id="events"></div></section>
  </div>
</main>
<script>
let state = null;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function api(path, method='GET') {
  const r = await fetch(path, { method, cache:'no-store', headers: { 'accept':'application/json' } });
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.message || body.error || `HTTP ${r.status}`);
  return body;
}

async function refresh() {
  try {
    state = await api('/api/state');
    render();
  } catch (e) {
    document.getElementById('notice').innerHTML = `<div class="notice">Control service unavailable: ${esc(e.message)}</div>`;
  }
}

function render() {
  const human = state.control.owner === 'human';
  document.getElementById('service').textContent = `v${state.service.version} · ShellCore · Human :${state.service.humanPort} · observe and intervene only`;
  const owner = document.getElementById('owner');
  owner.textContent = human ? 'HUMAN CONTROL' : 'AGENT CONTROL';
  owner.className = `badge ${human ? 'human' : 'agent'}`;
  document.getElementById('take').disabled = human;
  document.getElementById('release').disabled = !human;
  document.getElementById('notice').innerHTML = human
    ? '<div class="notice">New Agent mutations are blocked. Already-running work continues until you explicitly terminate it.</div>'
    : '';

  renderExecutions(human);
  renderJobs(human);
  renderShells(human);
  renderEvents();
}

function renderExecutions(human) {
  const root = document.getElementById('executions');
  if (!state.executions.length) { root.innerHTML = '<div class="empty">No active exec calls.</div>'; return; }
  root.innerHTML = state.executions.map(x => `
    <div class="card"><div class="row"><div><b>#${x.executionId}</b> running</div>
    <button class="danger" ${human ? '' : 'disabled'} onclick="terminateExecution(${x.executionId})">Terminate</button></div>
    <div class="command">${esc(x.command)}</div>
    <div class="meta">cwd: ${esc(x.cwd || 'default')}${x.cancelRequested ? ' · termination requested by '+esc(x.cancelSource) : ''}</div></div>`).join('');
}

function renderJobs(human) {
  const root = document.getElementById('jobs');
  if (!state.jobs.length) { root.innerHTML = '<div class="empty">No jobs.</div>'; return; }
  root.innerHTML = state.jobs.map(x => {
    const running = x.status === 'running';
    const source = x.terminationSource ? ` · terminated by ${esc(x.terminationSource)}` : '';
    return `<div class="card"><div class="row"><div><b>#${x.jobId}</b> ${esc(x.status)}</div>
    <button class="danger" ${human && running ? '' : 'disabled'} onclick="stopJob(${x.jobId})">Stop</button></div>
    <div class="command">${esc(x.command)}</div><div class="meta">cwd: ${esc(x.cwd || 'default')}${source}</div></div>`;
  }).join('');
}

function renderShells(human) {
  const root = document.getElementById('shells');
  if (!state.shells.length) { root.innerHTML = '<div class="empty">No shells.</div>'; return; }
  root.innerHTML = state.shells.map(x => {
    const running = x.status === 'running';
    const source = x.terminationSource ? ` · terminated by ${esc(x.terminationSource)}` : '';
    return `<div class="card"><div class="row"><div><b>#${x.shellId}</b> ${esc(x.status)}</div>
    <button class="danger" ${human && running ? '' : 'disabled'} onclick="killShell(${x.shellId})">Kill</button></div>
    <div class="meta">initial cwd: ${esc(x.initialCwd || 'default')}${source}</div></div>`;
  }).join('');
}

function renderEvents() {
  const root = document.getElementById('events');
  const items = [...state.events].reverse();
  if (!items.length) { root.innerHTML = '<div class="empty">No activity yet.</div>'; return; }
  root.innerHTML = items.map(e => `<div class="event"><div>#${e.seq}</div><div class="src">${esc(e.source)}</div><div><b>${esc(e.kind)}</b>${e.resourceId ? ` · ${esc(e.resource)} #${e.resourceId}` : ''}<div class="meta">${esc(e.message)}${e.messageTruncated ? ' …[truncated]' : ''}</div></div></div>`).join('');
}

async function takeControl(){ try { await api('/api/control/take','POST'); await refresh(); } catch(e){ alert(e.message); } }
async function releaseControl(){ try { await api('/api/control/release','POST'); await refresh(); } catch(e){ alert(e.message); } }
async function terminateExecution(id){ if(!confirm(`Terminate exec #${id}?`)) return; try { await api(`/api/executions/${id}/terminate`,'POST'); await refresh(); } catch(e){ alert(e.message); } }
async function stopJob(id){ if(!confirm(`Stop job #${id}?`)) return; try { await api(`/api/jobs/${id}/stop`,'POST'); await refresh(); } catch(e){ alert(e.message); } }
async function killShell(id){ if(!confirm(`Kill shell #${id}?`)) return; try { await api(`/api/shells/${id}/kill`,'POST'); await refresh(); } catch(e){ alert(e.message); } }

refresh();
setInterval(refresh, 1000);
</script>
</body>
</html>
